# Security headers for every response. nginx drops the server-level add_header lines in any location that has its
# own add_header, so nginx.conf includes this file in each location instead of setting them once.
# HSTS is set here even though Traefik terminates TLS in front of this container. It is safe behind Traefik: the
# public domain is served over HTTPS only, so browsers get the header over HTTPS, and they ignore it on a plain http
# response (RFC 6797 §8.1), such as the container's own http:8080. No preload: that commits the domain for good.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The Content-Security-Policy line, with the hashes of the build's inline scripts and styles. The web Dockerfile
# generates it with packages/web/scripts/csp-header.mjs; its policy carries frame-ancestors 'none'.
include /etc/nginx/snippets/csp.conf;
