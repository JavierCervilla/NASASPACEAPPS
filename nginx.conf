# Save-Data: on (VENT-118): the browser asks to save data, so the hero's start frame is answered with the still.
map $http_save_data $hero_save_data {
  default 0;
  ~*^on$ 1;
}

server {
  # nginx-unprivileged runs as a non-root user, so it listens on 8080 rather than 80.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Redirects keep the request's own host and scheme: behind the proxy, nginx would otherwise name its port 8080.
  absolute_redirect off;

  gzip on;
  # The KTX2 transcoder's wasm gzips from 527 kB to 245 kB (VENT-101); the KTX2 maps are already compressed.
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # The KTX2 transcoder's worker (VENT-101) runs under the CSP of its own response, which allows the transcoder's
  # eval and wasm; never the page's (nginx-basis-worker-headers.conf). Fingerprinted like the rest of /_astro/.
  location ~ ^/(app/)?_astro/basis-worker-[A-Za-z0-9_-]+\.js$ {
    include /etc/nginx/snippets/basis-worker-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The KTX2 maps (VENT-101) with their media type, cached as their folder is: the on-foot ones are fingerprinted.
  location ~ ^/(app/)?_astro/.+\.ktx2$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    types { }
    default_type image/ktx2;
  }

  location ~ ^/(app/)?textures/.+\.ktx2$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    types { }
    default_type image/ktx2;
  }

  # Astro fingerprints everything under _astro/, the landing's and the app's: cache it for a year. After the regex
  # locations above, which nginx tries in order: the transcoder's worker and the KTX2 maps keep their own.
  location ~ ^/(app/)?_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # three's Basis Universal transcoder (VENT-101), copied at build under three's version: cached for good.
  location ~ ^/(app/)?basis/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The Moon maps are not fingerprinted: a day of cache, then revalidate.
  location ~ ^/(app/)?textures/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The site thumbnails and the app icons (with the favicon's phase frames) are not fingerprinted either and change
  # rarely: a day, then revalidate, instead of the browser's heuristic guess (VENT-96).
  location ~ ^/(app/)?thumbs/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The hero's start frame (VENT-116): under Save-Data the page shows the still and asks for no video, but the
  # <picture> and its preload have already asked for the start frame by then, so nginx answers that request with
  # the still's bytes (VENT-118) and the page does not ask for the still again: one picture, not two. Cached per
  # Save-Data, a day, then revalidate.
  location ~ ^/media/hero/hero-(phone|desktop)-start\.webp$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    add_header Vary "Save-Data";
    if ($hero_save_data) {
      rewrite ^/media/hero/hero-(phone|desktop)-start\.webp$ /media/hero/hero-$1-poster.webp break;
    }
  }

  # The landing's pictures (VENT-109): the hero film (VENT-116, rendered in VENT-112: its poster and its videos, which
  # nginx serves as video/mp4 with byte ranges) and the tour's views, not fingerprinted.
  location ~ ^/media/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The 3D view's loader films (VENT-117), one per curated site and cut, not fingerprinted: a day, then revalidate;
  # served as video/mp4 with byte ranges, and never kept by the service worker.
  location ~ ^/(app/)?site-films/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  location ~ ^/(app/)?icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The service worker (VENT-28) must be fetched fresh on every check, or a deploy reaches visitors a day late; its
  # scope is the folder it is served from: /app/sw.js the app's pages, and /sw.js only retires the worker the app
  # registered at the root before it moved under /app (VENT-109).
  location ~ (^|/)sw\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # The web app manifests, with the media type browsers expect whatever nginx's mime.types holds.
  location ~ \.webmanifest$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    types { }
    default_type application/manifest+json;
  }

  # The landing's pages (VENT-109). A link made before the app moved under /app carries the app's place in its query
  # (?site=, ?lat&lon): it opens the app at the same locale, query and hash (the browser keeps the hash). Only the
  # landing's own pages redirect, so no other path can be sent anywhere.
  location ~ ^/((es|fr|de|it)/)?$ {
    if ($arg_site != "") { return 302 /app$uri$is_args$args; }
    if ($arg_lat != "") { return 302 /app$uri$is_args$args; }
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ $uri.html =404;
  }
}
