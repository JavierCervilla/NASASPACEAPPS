# Security headers for every response. nginx drops the server-level add_header lines in any location that has its
# own add_header, so nginx.conf includes this file in each location instead of setting them once.
# HSTS is not set here: Traefik terminates TLS in front of this container and owns Strict-Transport-Security.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# The Content-Security-Policy line, with the hashes of the build's inline scripts and styles. The web Dockerfile
# generates it with packages/web/scripts/csp-header.mjs; its policy carries frame-ancestors 'none'.
include /etc/nginx/snippets/csp.conf;
