name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"

  agent-config:
    name: Guardián · Unicode safety and agent config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: node .claude/skills/security-gate/scripts/check-unicode-safety.mjs
      - run: node .claude/skills/security-gate/scripts/check-agent-config.mjs

  security:
    name: Guardián · security ladder (secrets + SAST + deps)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - name: Install deps (for npm audit)
        run: npm ci
      # `semgrep --version` fails the step when the binary is not on PATH; without it the ladder would skip SAST.
      - name: Install semgrep
        run: |
          pipx install semgrep || pip install --user semgrep
          semgrep --version
      - name: Install gitleaks
        run: |
          GL_VER="8.21.2"
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - name: Install osv-scanner
        run: |
          OSV_VER="1.9.2"
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/osv-scanner" --version
      - name: Security ladder (hard gate)
        run: bash .claude/skills/security-gate/scripts/security-gate.sh --strict .
