server {
  # nginx-unprivileged runs as a non-root user, so it listens on 8080 rather than 80.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Astro fingerprints everything under /_astro/: cache it for a year.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The Moon maps are not fingerprinted: a day of cache, then revalidate.
  location /textures/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The service worker (VENT-28) must be fetched fresh on every check, or a deploy reaches visitors a day late; its
  # scope is the folder it is served from, every locale's page.
  location ~ (^|/)sw\.js$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # The web app manifests, with the media type browsers expect whatever nginx's mime.types holds.
  location ~ \.webmanifest$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    types { }
    default_type application/manifest+json;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ $uri.html =404;
  }
}
