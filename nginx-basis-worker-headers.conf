# Headers for the KTX2 transcoder's worker (VENT-101, packages/web/src/textures/basis-worker.ts): the same as every
# other response (nginx-security-headers.conf; a unit test holds them equal) except the Content-Security-Policy. A
# worker runs under the CSP of its own script's response, not the page's. three's Basis Universal transcoder builds
# functions with `new Function` (Emscripten's embind) and compiles its wasm, so this one script gets 'unsafe-eval' and
# 'wasm-unsafe-eval'; the page's policy (csp.conf) is unchanged and never allows either. The worker has no DOM, loads
# only same-origin files (default-src 'self': its transcoder under /basis/ and the maps it is sent as bytes), and
# what it evaluates are embind's wrappers for fixed signatures, never data.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'" always;
